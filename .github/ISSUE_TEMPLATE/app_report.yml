name: 앱 오류 보고
description: 앱의 '오류 보고' 버튼으로 작성되는 보고서입니다. 직접 작성해도 됩니다.
labels: ["bug", "app-report"]
body:
  - type: markdown
    attributes:
      value: |
        녹음·녹취록·회의록 내용은 올리지 마세요. 이 저장소의 이슈는 누구나 볼 수 있습니다.
  - type: textarea
    id: description
    attributes:
      label: 무엇을 하던 중이었나요?
      description: 예) 1시간 회의 녹음 후 회의록 생성 중 앱이 꺼짐
      placeholder: 상황과 재현 방법을 적어 주세요 (선택)
  - type: textarea
    id: report
    attributes:
      label: 자동 수집 정보
      description: 앱이 채운 기기·오류 정보입니다. 잘렸다면 클립보드의 전체 보고서를 붙여넣어 주세요.
    validations:
      required: true
